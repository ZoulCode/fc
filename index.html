<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل المذاكرة - (A+)</title>

    <style>
:root{--ink:#1d2733;--mut:#5b6672;--bg:#f6f7f4;--card:#fff;--acc:#0f6b63;--acc2:#e8f3f1;--warn:#9a5b00;--warnbg:#fff4e0;--line:#d9ded8;--code:#14202b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.85;font-size:17px}
main{max-width:860px;margin:0 auto;padding:28px 18px 80px}
h1{font-size:2rem;margin:.2em 0 .1em}
h2{font-size:1.45rem;margin:2.2em 0 .6em;padding:.45em .8em;background:var(--acc);color:#fff;border-radius:6px}
h3{font-size:1.12rem;margin:1.5em 0 .4em;color:var(--acc);border-bottom:2px solid var(--acc2);padding-bottom:.15em}
p,li{max-width:75ch}
.sub{color:var(--mut);margin-top:0}
.box{background:var(--card);border:1px solid var(--line);border-right:5px solid var(--acc);border-radius:6px;padding:.7em 1em;margin:1em 0}
.box.warn{background:var(--warnbg);border-right-color:var(--warn)}
.box.know{background:var(--acc2)}
.box b.t{display:block;color:var(--acc);margin-bottom:.2em}
.box.warn b.t{color:var(--warn)}
table{border-collapse:collapse;width:100%;margin:.8em 0;background:var(--card);font-size:.93rem}
th,td{border:1px solid var(--line);padding:.35em .6em;text-align:right;vertical-align:top}
th{background:var(--acc2)}
.tw{overflow-x:auto}
code,pre,.en{direction:ltr;unicode-bidi:embed;font-family:Consolas,"Courier New",monospace}
pre{background:var(--code);color:#e6edf3;padding:.8em 1em;border-radius:6px;overflow-x:auto;text-align:left;font-size:.88rem;line-height:1.55;direction:ltr}
code{background:#eaeeea;padding:0 .3em;border-radius:3px;font-size:.9em}
pre code{background:none;padding:0}
details{background:var(--card);border:1px solid var(--line);border-radius:6px;margin:.5em 0;padding:.4em .9em}
summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:.4em;color:var(--acc)}
.q{color:var(--ink)}
ul,ol{padding-inline-start:1.4em}
.toc a{color:var(--acc);text-decoration:none}
.toc li{margin:.15em 0}
.tag{display:inline-block;font-size:.78rem;background:var(--acc2);color:var(--acc);border-radius:10px;padding:0 .6em;margin-inline-start:.4em}
.hot{background:#ffe9e9;color:#a11}
@media print{body{background:#fff;font-size:12.5pt}h2{break-after:avoid}details{break-inside:avoid}pre{white-space:pre-wrap}}
</style>
</head>

</body>
</html>
